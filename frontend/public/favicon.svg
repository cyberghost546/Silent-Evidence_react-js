<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Silent Evidence icon: red "SE" on the site's near-black, with a
       faint red glow. Used as the browser-tab icon, and the app icons
       in public/icons/ are made from it (see docs or README). -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#020617"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>
  <text x="256" y="330" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="230" fill="#dc2626" letter-spacing="-8">SE</text>
  <rect x="146" y="366" width="220" height="10" rx="5" fill="#dc2626" opacity="0.8"/>
</svg>
