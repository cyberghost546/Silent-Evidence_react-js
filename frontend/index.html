<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the page use the whole iPhone screen,
         and turns on env(safe-area-inset-...) so the phone tab bar
         (BottomNav.jsx) can stay clear of the home swipe bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Silent Evidence</title>
    <meta name="description" content="A community for horror story readers and writers." />

    <!-- THE APP (installable "Progressive Web App"):
         manifest    = name, icons and colours for the home-screen app
         theme-color = the colour of the phone's top bar
         apple-*     = the same things for iPhones (Safari doesn't read
                       everything from the manifest)
         The service worker (public/sw.js) is registered in src/main.jsx. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#020617" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Silent Evidence" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
